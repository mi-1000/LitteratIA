# Base compose with infrastructure services only (postgres, redis)
# For full stack, use: docker compose -f docker-compose.yml -f app.compose.override.yml up
services:
  postgres:
    image: postgres:16
    container_name: docker-postgres-litteratia
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-litteratia}
    # command:
    #   - postgres
    #   - -c
    #   - logging_collector=on
    #   - -c
    #   - log_directory=/var/log/postgresql
    #   - -c
    #   - log_filename=postgresql-%Y-%m-%d.log
    #   - -c
    #   - log_statement=all
    #   - -c
    #   - log_duration=on
    #   - -c
    #   - log_line_prefix=%t [%p] %u@%d [%a]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./data/init-db.sql:/docker-entrypoint-initdb.d/init.sql
      - pglogs:/var/log/postgresql # Nouveau volume pour les logs
    ports:
      - "127.0.0.1:5432:5432"
  
  pgadmin:
    image: dpage/pgadmin4
    container_name: litteratia_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      # Empêche pgAdmin de demander de changer le mdp au premier lancement
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'True'
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres

  redis:
    image: redis
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  db-data:
  pglogs:

networks:
  litteratia-network:
    driver: bridge